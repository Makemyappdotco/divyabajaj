# production-smoke-manual-only
name: Production Full Blueprint Smoke

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test live location, background report, QA and PDF
        id: smoke_test
        continue-on-error: true
        env:
          BASE_URL: https://divyabajaj.vercel.app
        run: |
          python3 - <<'PY'
          import json, os, re, time
          from urllib import request, parse, error
          BASE = os.environ['BASE_URL'].rstrip('/')
          metrics = {'status':'running','checked_url':BASE,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          def save():
              os.makedirs('docs',exist_ok=True)
              with open('docs/production-smoke-status.json','w',encoding='utf-8') as f: json.dump(metrics,f,indent=2,ensure_ascii=False)
          def http_json(path, method='GET', payload=None, timeout=70):
              data=None; headers={'Accept':'application/json','User-Agent':'DivyaBajajProductionSmoke/1.0'}
              if payload is not None:
                  data=json.dumps(payload).encode(); headers['Content-Type']='application/json'
              req=request.Request(BASE+path,data=data,headers=headers,method=method)
              try:
                  with request.urlopen(req,timeout=timeout) as r: return r.status,json.loads(r.read().decode() or '{}')
              except error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {raw[:1600]}')
          try:
              metrics['step']='health'; status,health=http_json('/health'); assert status==200 and health.get('status')=='ok'; metrics['health']='ok'
              metrics['step']='location_search'; lm={}
              for q in ['Yamunanagar','Model Town']:
                  status,r=http_json('/api/locations/search?q='+parse.quote(q)); locs=r.get('locations') or []; labels=[str(x.get('place_name') or '') for x in locs]
                  assert len(locs)>=2; assert all('°' not in x for x in labels); lm[q]=labels[:8]
              metrics['locations']=lm
              payload={'name':'Production Smoke Test','gender':'male','email':'smoke-test@example.com','phone':'9999999999','dob':'1994-08-23','tob':'07:35','birth_time_accuracy':'family_confirmed','pob':'Delhi, Delhi, India','latitude':28.6139,'longitude':77.2090,'timezone':5.5,'timezone_id':'Asia/Kolkata','country_code':'IN','question':'Business, money, relationship and marriage clarity','source':'production_smoke_test'}
              metrics['step']='background_start'; started=time.time(); status,job=http_json('/api/reports/paid-test-v2/start','POST',payload,90); assert status==202 and job.get('job_token'); metrics['startup_seconds']=round(time.time()-started,1)
              metrics['step']='background_poll'; final=None
              for _ in range(45):
                  time.sleep(12); status,p=http_json('/api/reports/paid-test-v2/status','POST',{'job_token':job['job_token'],'response_ids':job.get('response_ids') or {}},70)
                  if p.get('completed'): final=p; break
              assert final is not None; report=final.get('report_text') or ''; assert final.get('qa',{}).get('passed') is True
              wc=len(re.findall(r"\b[\w’'-]+\b",report)); assert wc>=7000; metrics['report_word_count']=wc; metrics['generation_seconds']=round((final.get('generation_ms') or 0)/1000,1); metrics['qa']=final.get('qa'); metrics['report_id']=final.get('report_id'); metrics['archive']=final.get('archive')
              metrics['step']='pdf'; data=json.dumps({'lead':payload,'numbers':final.get('numbers') or {},'astrology_data':final.get('astrology_data'),'report_text':report,'report_type':'paid_blueprint_live'}).encode(); req=request.Request(BASE+'/api/reports/pdf-direct',data=data,headers={'Content-Type':'application/json','Accept':'application/pdf'},method='POST')
              with request.urlopen(req,timeout=120) as r:
                  pdf=r.read(); assert r.status==200 and pdf[:4]==b'%PDF' and len(pdf)>10000; metrics['pdf_bytes']=len(pdf)
              metrics['status']='passed'; metrics['step']='complete'; save()
          except Exception as exc:
              metrics['status']='failed'; metrics['error']=str(exc)[:2000]; save(); raise
          PY

      - name: Publish smoke status
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke_test.outcome }}
        run: |
          git config user.name "divya-production-smoke"
          git config user.email "actions@users.noreply.github.com"
          git add docs/production-smoke-status.json
          git commit -m "Record production smoke result" || exit 0
          git push origin HEAD:main

      - name: Fail workflow when smoke failed
        if: steps.smoke_test.outcome != 'success'
        run: exit 1
