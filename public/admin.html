      rows +
      '<div class="block-add">' +
        '<div class="f"><label for="blkFrom">From</label><input type="date" id="blkFrom"></div>' +
        '<div class="f"><label for="blkTo">To (inclusive)</label><input type="date" id="blkTo"></div>' +
        '<div class="f"><label for="blkWhy">Reason</label><input type="text" id="blkWhy" placeholder="optional"></div>' +
        '<button class="btn" id="addBlock">Block these dates</button>' +
      '</div><div class="save-note" id="blockNote" style="margin-top:9px"></div></div>';
  }

  function upcomingCard(sched) {
    if (!sched.upcoming.length) {
      return '<div class="card" id="upcomingCard" style="margin-top:14px">' +
        '<div class="section-head"><div class="section-title">Upcoming calls</div></div>' +
        '<div class="dim" style="font-size:13px">Nothing booked yet.</div></div>';
    }
    var rows = sched.upcoming.map(function (a) {
      var lead = a.lead || {};
      return '<tr data-appt="' + esc(a.id) + '">' +
        '<td>' + esc(lead.name || '—') +
          (lead.phone ? '<div class="dim" style="font-size:11.5px">' + esc(lead.phone) + '</div>' : '') +
          (lead.email ? '<div class="dim" style="font-size:11.5px">' + esc(lead.email) + '</div>' : '') + '</td>' +
        '<td class="nowrap">' + esc(exactWhen(a.starts_at, true)) + '</td>' +
        '<td>' + productTag('consultation') +
          '<div class="dim" style="font-size:11px;margin-top:3px">' + esc(a.status.replace(/_/g, ' ')) + '</div></td>' +
        '<td style="font-size:12px">' + esc((a.customer_question || '').slice(0, 90)) + '</td>' +
        '<td class="nowrap" style="text-align:right">' +
          '<button class="dl" data-move="' + esc(a.id) + '">Reschedule</button> ' +
          '<button class="btn quiet" data-cancel="' + esc(a.id) + '">Cancel</button></td></tr>' +
        // The slot picker unfolds under its own booking rather than in a dialog,
        // so it is always obvious which call is being moved.
        '<tr class="move-row" id="move_' + esc(a.id) + '" hidden><td colspan="5"></td></tr>';
    }).join('');
    return '<div class="card" id="upcomingCard" style="padding:0;margin-top:14px">' +
      '<div class="section-head" style="padding:17px 19px 0;margin-bottom:8px">' +
      '<div class="section-title">Upcoming calls</div>' +
      '<div class="section-note">' + sched.upcoming.length + ' booked</div></div>' +
      '<div class="t-wrap"><table>' +
      '<thead><tr><th>Customer</th><th>When</th><th>Type</th><th>Question</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }

  /**
   * Reschedule: show the same slots a customer would see, and move the booking
   * onto the one Divya picks. Uses the public availability endpoint so she can
   * never place a call outside her own hours or on top of another booking.
   */
  function wireReschedule() {
    document.querySelectorAll('[data-move]').forEach(function (button) {
      button.addEventListener('click', function () {
        var id = button.getAttribute('data-move');
        var row = $('move_' + id);
        if (!row.hidden) { row.hidden = true; button.textContent = 'Reschedule'; return; }
        button.textContent = 'Cancel move';
        row.hidden = false;
        row.querySelector('td').innerHTML = '<div class="dim" style="font-size:13px;padding:4px 0">Loading free slots…</div>';

        fetch('/api/booking/availability?days=30', { headers: { Accept: 'application/json' }, cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.success || !d.days.length) {
              row.querySelector('td').innerHTML = '<div class="dim" style="font-size:13px;padding:4px 0">' +
                'No free slots in the next 30 days. Free some time up first, or cancel this booking.</div>';
              return;
            }
            var html = '<div style="padding:6px 0 10px"><div class="dim" style="font-size:12px;margin-bottom:8px">' +
              'Pick the new time. The customer is not notified automatically yet, so message them after.</div>' +
              '<div style="display:flex;gap:7px;flex-wrap:wrap">';
            d.days.slice(0, 8).forEach(function (day) {
              day.slots.forEach(function (slot) {
                html += '<button class="dl" data-slot="' + esc(slot.starts_at) + '" data-for="' + esc(id) + '">' +
                  esc(new Date(slot.starts_at).toLocaleString('en-IN', {
                    timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric', month: 'short',
                    hour: 'numeric', minute: '2-digit', hour12: true
                  })) + '</button>';
              });
            });
            row.querySelector('td').innerHTML = html + '</div><div class="save-note" id="moveNote_' + esc(id) + '" style="margin-top:9px"></div></div>';

            row.querySelectorAll('[data-slot]').forEach(function (pick) {
              pick.addEventListener('click', function () {
                pick.disabled = true;
                pick.textContent = 'Moving…';
                apiWrite('/appointment/' + id + '/reschedule', 'POST', { starts_at: pick.getAttribute('data-slot') })
                  .then(renderConsultations)
                  .catch(function (e) {
                    pick.disabled = false;
                    note('moveNote_' + id, 'bad', e.message);
                  });
              });
            });
          })
          .catch(function (e) {
            row.querySelector('td').innerHTML = '<div class="save-note bad">' + esc(e.message) + '</div>';
          });
      });
    });
  }

  function calendarCard(sched) {
    return '<div class="card" style="margin-top:14px">' +
      '<div class="section-head"><div class="section-title">Google Calendar</div>' +
      '<div class="section-note">' + (sched.calendar_connected ? 'connected' : 'not connected') + '</div></div>' +
      '<div class="dim" style="font-size:13px;line-height:1.6">' + esc(sched.calendar_note) +
      ' Once it is, every booking lands in Divya\'s calendar with a Google Meet link, and anything already in her calendar blocks that time automatically.</div>' +
      '<div class="btn-row"><button class="btn" disabled>Connect Google Calendar</button>' +
      '<span class="save-note">Needs the Google project set up first.</span></div></div>';
  }

  function note(id, kind, text) {
    var el = $(id);
    if (!el) return;
    el.className = 'save-note' + (kind ? ' ' + kind : '');
    el.textContent = text;
  }

  function wireSchedule() {
    document.querySelectorAll('.sched-day').forEach(function (row) {
      row.querySelector('.s-on').addEventListener('change', function (e) {
        row.classList.toggle('off', !e.target.checked);
      });
      // Every field repaints the preview, so the result of a change is visible
      // the moment it is made rather than after a save.
      ['.s-from', '.s-to', '.s-len', '.s-cap'].forEach(function (sel) {
        row.querySelector(sel).addEventListener('input', function () { paintPreview(row); });
        row.querySelector(sel).addEventListener('change', function () { paintPreview(row); });
      });
    });

    // Copy one day's settings onto every day that is switched on. This is the
    // difference between setting up a week in four clicks and in twenty-eight.
    document.querySelectorAll('[data-copy]').forEach(function (button) {
      button.addEventListener('click', function () {
        var source = rowOf(Number(button.getAttribute('data-copy')));
        var values = ['.s-from', '.s-to', '.s-len', '.s-gap', '.s-cap'].map(function (sel) {
          return source.querySelector(sel).value;
        });
        var copied = 0;
        document.querySelectorAll('.sched-day').forEach(function (row) {
          if (row === source || !row.querySelector('.s-on').checked) return;
          ['.s-from', '.s-to', '.s-len', '.s-gap', '.s-cap'].forEach(function (sel, i) {
            row.querySelector(sel).value = values[i];
          });
          paintPreview(row);
          copied++;
        });
        note('hoursNote', copied ? 'ok' : 'bad', copied
          ? 'Copied to ' + copied + ' other open day' + (copied > 1 ? 's' : '') + '. Save to apply.'
          : 'No other days are switched on to copy to.');
      });
    });

    document.querySelectorAll('[data-preset]').forEach(function (button) {
      button.addEventListener('click', function () {
        var preset = PRESETS[button.getAttribute('data-preset')];
        document.querySelectorAll('.sched-day').forEach(function (row) {
          var on = preset.days.indexOf(Number(row.getAttribute('data-weekday'))) >= 0;
          row.querySelector('.s-on').checked = on;
          row.classList.toggle('off', !on);
          if (on) {
            row.querySelector('.s-from').value = preset.from;
            row.querySelector('.s-to').value = preset.to;
          }
          paintPreview(row);
        });
        note('hoursNote', 'ok', 'Filled in. Adjust anything, then save.');
      });
    });

    $('saveHours').addEventListener('click', function () {
      var button = $('saveHours');
      button.disabled = true;
      note('hoursNote', '', 'Saving…');
      apiWrite('/hours', 'PUT', { week: readWeek() })
        .then(function (d) {
          note('hoursNote', 'ok', d.active_days
            ? 'Saved. ' + d.active_days + ' day' + (d.active_days > 1 ? 's' : '') + ' open for booking.'
            : 'Saved. No days are open, so the booking page will say booking opens shortly.');
        })
        .catch(function (e) { note('hoursNote', 'bad', e.message); })
        .then(function () { button.disabled = false; });
    });

    $('addBlock').addEventListener('click', function () {
      var from = $('blkFrom').value, to = $('blkTo').value;
      if (!from || !to) return note('blockNote', 'bad', 'Pick both dates.');
      // "To" is inclusive in Divya's head, so the range runs to the END of that
      // day rather than to midnight at its start.
      apiWrite('/block', 'POST', {
        starts_at: from + 'T00:00:00+05:30',
        ends_at: to + 'T23:59:59+05:30',
        reason: $('blkWhy').value
      })
        .then(function (d) {
          if (d.warning) { note('blockNote', 'bad', d.warning); setTimeout(renderConsultations, 2600); }
          else renderConsultations();
        })
        .catch(function (e) { note('blockNote', 'bad', e.message); });
    });

    document.querySelectorAll('[data-unblock]').forEach(function (button) {
      button.addEventListener('click', function () {
        apiWrite('/block/' + button.getAttribute('data-unblock'), 'DELETE')
          .then(renderConsultations)
          .catch(function (e) { note('blockNote', 'bad', e.message); });
      });
    });

    document.querySelectorAll('[data-cancel]').forEach(function (button) {
      button.addEventListener('click', function () {
        // Deliberately two taps rather than a confirm() dialog: a native dialog
        // inside an iframe-able admin page is easy to mis-tap on a phone.
        if (button.getAttribute('data-armed') !== '1') {
          button.setAttribute('data-armed', '1');
          button.textContent = 'Tap again to cancel';
          setTimeout(function () {
            button.removeAttribute('data-armed');
            button.textContent = 'Cancel';
          }, 4000);
          return;
        }
        button.disabled = true;
        apiWrite('/appointment/' + button.getAttribute('data-cancel') + '/cancel', 'POST', { reason: 'cancelled from the admin panel' })
          .then(renderConsultations)
          .catch(function (e) { button.disabled = false; alert(e.message); });
      });
    });
  }

  /**
   * One place that decides how a product line looks, so the Reports tab, the
   * Customers tab and the drawer can never drift into three different vocabularies.
   */
  function productTag(category) {
    if (category === 'consultation') return '<span class="pill consultation">Consultation</span>';
    if (category === 'paid') return '<span class="pill paid">Paid report</span>';
    return '<span class="pill free">Free report</span>';
  }

  function downloadButton(report) {
    if (report.status !== 'completed') {
      return '<button class="dl" disabled title="Only finished reports can be downloaded">Download</button>';
    }
    return '<button class="dl" data-download="' + esc(report.id) + '">Download</button>';
  }

  /**
   * Mints a fresh signed link and opens it. The pdf_url stored on the row is not
   * reusable - paid rows hold a literal placeholder and free rows hold a
   * signature that expired 30 days after generation - so it is always re-signed.
   */
  function wireDownloads() {
    document.querySelectorAll('[data-download]').forEach(function (button) {
      button.addEventListener('click', function () {
        var original = button.textContent;
        button.disabled = true;
        button.textContent = 'Preparing…';
        api('report/' + button.getAttribute('data-download') + '/download')
          .then(function (d) {
            window.open(d.url, '_blank', 'noopener');
            button.textContent = original;
            button.disabled = false;
          })
          .catch(function (e) {
            button.textContent = 'Failed';
            button.title = e.message;
            setTimeout(function () { button.textContent = original; button.disabled = false; }, 2500);
          });
      });
    });
  }

  function renderConsultations() {
    view.innerHTML = loading(3);
    // Pricing must never be able to take the tab down: on a deployment without
    // Supabase the endpoint answers 503, and the bookings still need to show.
    Promise.all([
      api('consultations'),
      apiSchedule(),
      apiPricing().catch(function (error) { console.error('[pricing]', error.message); return null; })
    ]).then(function (both) {
      var d = both[0], sched = both[1], prices = both[2];
      var html = '<div class="grid tiles">' +
        // Clickable: Dhruv expected the tile to take him to the bookings it counts.
        '<div id="upcomingTile" class="clickable" title="Show the bookings">' +
          tile('Upcoming', num(d.upcoming), 'scheduled ahead &middot; click to view') + '</div>' +
        tile('Completed', num(d.past), 'already happened') +
        tile('Held slots', num(d.active_holds), 'awaiting payment') +
        '</div>' +
        (prices ? pricingCard(prices) : '') +
        '<div style="margin-top:14px">' + scheduleCard(sched) + '</div>' +
        blocksCard(sched) + upcomingCard(sched) + calendarCard(sched);
      view.innerHTML = html;
      wirePricing();
      wireSchedule();
      wireReschedule();
      var tileButton = $('upcomingTile');
      if (tileButton) tileButton.addEventListener('click', function () {
        var card = $('upcomingCard');
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          card.style.transition = 'box-shadow .3s';
          card.style.boxShadow = '0 0 0 2px var(--gold)';
          setTimeout(function () { card.style.boxShadow = ''; }, 1400);
        }
      });
    }).catch(function (error) { view.innerHTML = fail(error.message); });
  }

  function renderConsultationsLegacy() {
    view.innerHTML = loading(3);
    api('consultations').then(function (d) {
      var html = '<div class="grid tiles">' +
        tile('Upcoming', num(d.upcoming), 'scheduled ahead') +
        tile('Completed', num(d.past), 'already happened') +
        tile('Held slots', num(d.active_holds), 'awaiting payment') +
        '</div>';

      if (!d.appointments.length && !d.bookings.length) {
        html += '<div style="margin-top:14px">' + empty(
          'No consultations yet',
          'The booking tables are wired up and ready. Once the consultation flow goes live, appointments will appear here automatically.'
        ) + '</div>';
      } else {
        var rows = d.appointments.map(function (a) {
          return '<tr class="clickable" data-lead="' + esc(a.lead_id) + '">' +
            '<td>' + esc(a.lead_name || '—') + '</td>' +
            '<td class="nowrap">' + esc(exactWhen(a.starts_at)) + '</td>' +
            '<td>' + esc(a.mode || '') + '</td>' +
            '<td><span class="pill">' + esc(a.status) + '</span></td>' +
            '<td style="font-size:12px">' + esc(a.customer_question || '') + '</td></tr>';
        }).concat(d.bookings.map(function (b) {
          return '<tr class="clickable" data-lead="' + esc(b.lead_id) + '">' +
            '<td>' + esc(b.lead_name || '—') + '</td>' +
            '<td class="nowrap">' + esc(b.date) + ' ' + esc(b.time_slot) + '</td>' +
            '<td>' + esc(b.mode || '') + '</td>' +
            '<td><span class="pill">' + esc(b.status) + '</span></td>' +
            '<td style="font-size:12px">' + esc(b.notes || '') + '</td></tr>';
        })).join('');
        html += '<div class="card" style="padding:0;margin-top:14px"><div class="t-wrap"><table>' +
          '<thead><tr><th>Customer</th><th>When</th><th>Mode</th><th>Status</th><th>Note</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div></div>';
      }
      view.innerHTML = html;
      wireRowDrawer();
    }).catch(function (error) { view.innerHTML = fail(error.message); });
  }

  function renderHealth() {
    view.innerHTML = loading(3);
    api('health', { days: state.days }).then(function (d) {
      var gen = d.generation_time_seconds;
      var reasons = Object.keys(d.failure_reasons);

      var html = '<div class="grid tiles">' +
        tile('Failed reports', num(d.failed_reports.length), 'in the last ' + d.window_days + ' days') +
        tile('Slowest generation', duration(gen.slowest), gen.measured + ' timed') +
        tile('Stuck jobs', num(d.stuck_jobs.length), 'queued or retrying') +
        tile('Unprocessed webhooks', num(d.unprocessed_webhooks.length), '') +
        '</div>';

      html += '<div class="card" style="margin-top:14px"><div class="section-head"><div class="section-title">Failures</div>' +
        '<div class="section-note">' + (reasons.length ? 'grouped by cause' : '') + '</div></div>';
      if (!d.failed_reports.length) {
        html += '<div class="empty"><strong>Nothing has failed</strong>No report failed in this window.</div>';
      } else {
        html += '<div class="legend" style="margin-bottom:12px">' + reasons.map(function (r) {
          return '<span><i class="swatch" style="background:var(--failed)"></i>' + esc(r) + ' &middot; ' + d.failure_reasons[r] + '</span>';
        }).join('') + '</div><div class="t-wrap"><table>' +
          '<thead><tr><th>Customer</th><th>Type</th><th>Reason</th><th>When</th></tr></thead><tbody>' +
          d.failed_reports.map(function (r) {
            return '<tr class="clickable" data-lead="' + esc(r.lead_id) + '">' +
              '<td>' + esc(r.lead_name || '—') + '</td>' +
              '<td class="dim" style="font-size:12px">' + esc(r.type) + '</td>' +
              '<td style="font-size:12px"><span class="pill bad">' + esc(r.failure_code || 'unspecified') + '</span>' +
                '<div class="dim" style="margin-top:4px">' + esc((r.failure_message || '').slice(0, 160)) + '</div></td>' +
              '<td class="nowrap" title="' + esc(exactWhen(r.created_at)) + '">' + esc(when(r.created_at)) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      html += '</div>';

      if (d.slowest_reports.length) {
        var worst = d.slowest_reports[0].generation_seconds || 1;
        html += '<div class="card" style="margin-top:14px"><div class="section-head"><div class="section-title">Slowest generations</div>' +
          '<div class="section-note">median is ' + duration(gen.median) + '</div></div><div class="t-wrap"><table><tbody>' +
          d.slowest_reports.map(function (r) {
            var pct = Math.max(3, (Number(r.generation_seconds) / worst) * 100);
            return '<tr><td style="width:150px">' + esc(r.lead_name || r.id) + '</td>' +
              '<td><div style="background:var(--paid);height:8px;border-radius:4px;width:' + pct + '%"></div></td>' +
              '<td class="mono nowrap" style="width:80px;text-align:right">' + duration(r.generation_seconds) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }

      view.innerHTML = html;
      wireRowDrawer();
    }).catch(function (error) { view.innerHTML = fail(error.message); });
  }

  /* ---------------- customer drawer ---------------- */

  function openCustomer(leadId) {
    var drawer = $('drawer');
    var body = $('drawerBody');
    body.innerHTML = '<div class="skeleton" style="height:160px"></div>';
    drawer.classList.add('on');

    fetch('/api/admin/customer/' + encodeURIComponent(leadId), { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Not found'); return j; }); })
      .then(function (d) {
        var l = d.lead;
        var html = '<div class="page-title">' + esc(l.name || 'Customer') + '</div>' +
          '<div class="page-sub">' + esc(l.email || '') + (l.phone ? ' &middot; ' + esc(l.phone) : '') + '</div>' +
          '<dl class="kv">' +
            '<dt>Born</dt><dd>' + esc(l.dob || '—') + (l.tob ? ' at ' + esc(l.tob) : '') + '</dd>' +
            '<dt>Place</dt><dd>' + esc(l.pob || '—') + '</dd>' +
            '<dt>Status</dt><dd>' + esc(l.status || '—') + '</dd>' +
            '<dt>Source</dt><dd>' + esc(l.utm_source || l.source || 'direct') + '</dd>' +
            '<dt>Environment</dt><dd>' + esc(l.environment || '') + '</dd>' +
            '<dt>First seen</dt><dd>' + esc(exactWhen(l.created_at)) + '</dd>' +
          '</dl>';

        html += '<div class="stack" style="margin-top:20px">';
        html += '<div><div class="section-title" style="margin-bottom:8px">Reports (' + d.reports.length + ')</div>' +
          (d.reports.length
            ? '<div class="card" style="padding:0"><div class="t-wrap"><table><tbody>' + d.reports.map(function (r) {
                return '<tr><td>' + productTag(r.category) + '</td>' +
                  '<td><span class="pill ' + (r.status === 'failed' ? 'bad' : 'ok') + '">' + esc(r.status) + '</span>' +
                  (r.failure_message ? '<div class="dim" style="font-size:11px;margin-top:3px">' + esc(r.failure_message.slice(0, 120)) + '</div>' : '') + '</td>' +
                  '<td class="mono nowrap">' + duration(r.generation_seconds) + '</td>' +
                  '<td class="nowrap dim">' + esc(when(r.created_at)) + '</td>' +
                  '<td style="text-align:right">' + downloadButton(r) + '</td></tr>';
              }).join('') + '</tbody></table></div></div>'
            : '<div class="empty">No reports yet.</div>') + '</div>';

        if (d.appointments.length || d.bookings.length) {
          html += '<div><div class="section-title" style="margin-bottom:8px">Consultations</div><div class="card" style="padding:0"><div class="t-wrap"><table><tbody>' +
            d.appointments.map(function (a) {
              return '<tr><td>' + esc(exactWhen(a.starts_at, true)) + '</td><td><span class="pill">' + esc(a.status) + '</span></td></tr>';
            }).join('') +
            d.bookings.map(function (b) {
              return '<tr><td>' + esc(b.date) + ' ' + esc(b.time_slot) + '</td><td><span class="pill">' + esc(b.status) + '</span></td></tr>';
            }).join('') + '</tbody></table></div></div></div>';
        }

        if (d.messages.length) {
          html += '<div><div class="section-title" style="margin-bottom:8px">Messages sent</div><div class="card" style="padding:0"><div class="t-wrap"><table><tbody>' +
            d.messages.map(function (m) {
              return '<tr><td>' + esc(m.channel) + '</td><td>' + esc(m.subject || m.recipient || '') + '</td>' +
                '<td><span class="pill ' + (m.failed_at ? 'bad' : 'ok') + '">' + esc(m.status) + '</span></td>' +
                '<td class="dim nowrap">' + esc(when(m.sent_at || m.queued_at)) + '</td></tr>';
            }).join('') + '</tbody></table></div></div></div>';
        }

        if (d.events.length) {
          html += '<div><div class="section-title" style="margin-bottom:8px">Activity</div><div class="card"><div class="t-wrap"><table><tbody>' +
            d.events.slice(0, 15).map(function (e) {
              return '<tr><td class="dim" style="font-size:12px">' + esc(e.type) + '</td>' +
                '<td class="dim nowrap" style="text-align:right">' + esc(when(e.created_at)) + '</td></tr>';
            }).join('') + '</tbody></table></div></div></div>';
        }

        html += '</div>';
        body.innerHTML = html;
        wireDownloads();
      })
      .catch(function (error) { body.innerHTML = fail(error.message); });
  }

  /* ---------------- wiring ---------------- */

  function pager(d, key) {
    var pages = Math.max(1, Math.ceil((d.total || 0) / (d.page_size || 25)));
    if (pages <= 1) return '<div class="pager"><span>' + num(d.total) + ' total</span></div>';
    return '<div class="pager"><span>' + num(d.total) + ' total &middot; page ' + d.page + ' of ' + pages + '</span>' +
      '<button data-page="prev"' + (d.page <= 1 ? ' disabled' : '') + '>Previous</button>' +
      '<button data-page="next"' + (d.page >= pages ? ' disabled' : '') + '>Next</button></div>';
  }

  function wirePager(key, rerender) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-page]'), function (button) {
      button.addEventListener('click', function () {
        state[key] += button.getAttribute('data-page') === 'next' ? 1 : -1;
        if (state[key] < 1) state[key] = 1;
        rerender();
      });
    });
  }

  function wireSegs() {
    var cat = $('catSeg');
    if (cat) cat.addEventListener('click', function (e) {
      var b = e.target.closest('[data-cat]'); if (!b) return;
      state.reportCategory = b.getAttribute('data-cat'); state.reportPage = 1; renderReports();
    });
    var stat = $('statSeg');
    if (stat) stat.addEventListener('click', function (e) {
      var b = e.target.closest('[data-stat]'); if (!b) return;
      state.reportStatus = b.getAttribute('data-stat'); state.reportPage = 1; renderReports();
    });
  }

  function wireRowDrawer() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-lead]'), function (row) {
      row.addEventListener('click', function () {
        var id = row.getAttribute('data-lead');
        if (id) openCustomer(id);
      });
    });
  }

  function renderNav() {
    $('nav').innerHTML = SECTIONS.map(function (s) {
      var badge = s.id === 'health' && state.failedCount
        ? '<span class="nav-badge">' + state.failedCount + '</span>' : '';
      return '<button class="nav-item" data-section="' + s.id + '"' +
        (state.section === s.id ? ' aria-current="page"' : '') + '>' + s.label + badge + '</button>';
    }).join('');
    $('nav').querySelectorAll('[data-section]').forEach(function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-section')); });
    });
  }

  function renderControls() {
    $('envSeg').innerHTML = [['production', 'Live'], ['test', 'Test'], ['all', 'All']].map(function (p) {
      return '<button data-env="' + p[0] + '" aria-pressed="' + (state.environment === p[0]) + '">' + p[1] + '</button>';
    }).join('');
    $('daySeg').innerHTML = [7, 30, 90].map(function (d) {
      return '<button data-days="' + d + '" aria-pressed="' + (state.days === d) + '">' + d + 'd</button>';
    }).join('');

    $('envSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-env]'); if (!b) return;
      state.environment = b.getAttribute('data-env');
      state.reportPage = 1; state.customerPage = 1;
      renderControls(); draw();
    });
    $('daySeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-days]'); if (!b) return;
      state.days = Number(b.getAttribute('data-days'));
      renderControls(); draw();
    });

    $('envNote').innerHTML = state.environment === 'production'
      ? 'Showing live customer data only. Your own test runs are excluded.'
      : state.environment === 'test'
        ? 'Showing test data only — your own runs, not real customers.'
        : 'Showing live and test data together, so these numbers are inflated by your own testing.';
  }

  function draw() {
    var section = SECTIONS.filter(function (s) { return s.id === state.section; })[0] || SECTIONS[0];
    $('pageTitle').textContent = section.label;
    $('pageSub').textContent = section.sub;
    renderNav();
    if (state.section === 'overview') renderOverview();
    else if (state.section === 'reports') renderReports();
    else if (state.section === 'customers') renderCustomers();
    else if (state.section === 'consultations') renderConsultations();
    else renderHealth();
  }

  function go(id) {
    state.section = id;
    if (location.hash !== '#' + id) location.hash = id;
    draw();
  }

  window.addEventListener('hashchange', function () {
    var id = location.hash.replace('#', '');
    if (SECTIONS.some(function (s) { return s.id === id; }) && id !== state.section) go(id);
  });

  // Theme. Light is the default because the cream and gold is the brand's
  // signature look, the same one the report and the public site use; dark is
  // there because the site offers it too and this panel gets long sessions.
  function applyTheme(name) {
    document.documentElement.setAttribute('data-theme', name);
    var button = $('themeBtn');
    if (button) {
      button.textContent = name === 'dark' ? 'Light mode' : 'Dark mode';
      button.setAttribute('aria-label', 'Switch to ' + (name === 'dark' ? 'light' : 'dark') + ' mode');
    }
    try { localStorage.setItem('db-admin-theme', name); } catch (e) {}
  }
  var savedTheme = 'light';
  try { savedTheme = localStorage.getItem('db-admin-theme') || 'light'; } catch (e) {}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  $('themeBtn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  $('drawerClose').addEventListener('click', function () { $('drawer').classList.remove('on'); });
  $('drawer').addEventListener('click', function (e) { if (e.target === $('drawer')) $('drawer').classList.remove('on'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('drawer').classList.remove('on'); });

  var initial = location.hash.replace('#', '');
  if (SECTIONS.some(function (s) { return s.id === initial; })) state.section = initial;
  renderControls();
  draw();
})();
</script>
</body>
</html>
