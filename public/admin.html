<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Divya Bajaj Admin</title>
<link rel="icon" href="/admin/divya-bajaj-monogram.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Brand tokens are taken straight from the live site (landing.html), so the
     panel and the public site cannot drift apart: same Fraunces/Hanken Grotesk
     pairing, same golds, same ivory and cream steps, same logo.

     Chart marks are the one place that cannot simply reuse the brand gold - at
     its brand chroma it reads grey as a data mark and fails the palette check.
     Each theme therefore carries its own validated trio (lightness band, chroma
     floor, colour-vision separation and 3:1 contrast all pass against that
     theme's own card surface). */
  :root{
    --serif:'Fraunces',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --radius:10px;
  }
  /* light - the brand's signature cream, and the panel default */
  :root, :root[data-theme="light"]{
    --bg:#F6F3EC; --surface:#FDFBF7; --surface-2:#EDE8DF; --line:#E2D9C8; --line-soft:#EFE8DA;
    --ink:#1A1714; --ink-2:#5C544A; --ink-3:#8A8073;
    --gold:#B08D4A; --gold-l:#C9A96E; --gold-d:#8A6F3A;
    /* Chart marks. Validated as a set against this theme's card surface:
       lightness band, chroma floor, CVD separation on ALL pairs (paid and
       failed sit directly against each other inside a stacked bar, so
       adjacent-pairs is not a strong enough check here) and 3:1 contrast. */
    --paid:#bb8844; --free:#2f6fbf; --failed:#990022;
    /* Red as TEXT and UI chrome is a different job from red as a mark - it
       needs 4.5:1, not 3:1 - so it gets its own token. */
    --danger:#a11b28; --badge-ink:#ffffff;
    --shadow:0 1px 2px rgba(26,23,20,.05), 0 8px 24px rgba(26,23,20,.04);
  }
  :root[data-theme="dark"]{
    --bg:#08070A; --surface:#0E0D12; --surface-2:#14131A; --line:#241f2c; --line-soft:#1b1823;
    --ink:#FAF7F2; --ink-2:#a89f93; --ink-3:#6f675e;
    --gold:#C9A96E; --gold-l:#DBBF8A; --gold-d:#A8894F;
    --paid:#bb8844; --free:#4a90d9; --failed:#bb2233;
    --danger:#ef6b6b; --badge-ink:#12070a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

  .side{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:26px}
  .brand{display:flex;align-items:center;gap:11px}
  /* height:auto - pinning both axes squashes the mark, and its ratio (1.129)
     is not the one a fixed box would guess. */
  .brand img{width:38px;height:auto;flex:none}
  .brand-name{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.005em;line-height:1.15}
  .brand-sub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
  .side-nav{display:flex;flex-direction:column;gap:1px}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-size:13.5px;white-space:nowrap;transition:background .13s,color .13s}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item[aria-current="page"]{background:var(--surface-2);color:var(--gold-d);font-weight:600}
  .nav-badge{font-size:10.5px;background:var(--danger);color:var(--badge-ink);border-radius:20px;padding:1px 7px;font-weight:600}
  .side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .theme-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);padding:6px 9px;border-radius:7px}
  .theme-btn:hover{background:var(--surface-2);color:var(--ink)}
  /* All of the narrow-screen overrides live here, AFTER the rules they override.
     Sitting above them (where this block used to be) they lost on source order
     alone and the sidebar stayed a full-width column ~850px tall on a phone. */
  @media (max-width:880px){
    /* minmax(0,1fr), not 1fr - a 1fr track's automatic minimum is min-content,
       so the nav row stretched the single column to 678px on a 390px phone and
       the whole page scrolled sideways. */
    .shell{grid-template-columns:minmax(0,1fr)}
    .side{position:sticky;top:0;z-index:20;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;min-width:0}
    /* min-width:0 - a flex item refuses to shrink below its content width by
       default, so the five nav items pushed the sticky header (and the whole
       page with it) 288px wider than the phone viewport. */
    /* Its own full-width second row. Sharing one row with the wordmark and the
       theme toggle left roughly 130px for five items, so most of the nav was
       hidden behind a scroll with no affordance. */
    .side-nav{flex-direction:row;overflow-x:auto;gap:2px;order:3;flex-basis:100%;min-width:0}
    .nav-item{padding:7px 11px}
    .brand-sub{display:none}
    .side-foot{margin-top:0;border-top:0;padding-top:0;margin-left:auto}
  }
  @media (max-width:460px){
    .brand-name{font-size:15px}
    .nav-item{padding:6px 9px;font-size:12.5px}
  }

  .main{padding:26px 30px 64px;min-width:0}
  @media (max-width:880px){.main{padding:18px 14px 40px}}
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
  .page-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.012em;line-height:1.15}
  .page-sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--gold-d);font-weight:600}
  .seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
  .env-note{font-size:11.5px;color:var(--ink-3)}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold-l),transparent);opacity:.55;margin:14px 0 18px}

  .grid{display:grid;gap:14px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow)}
  .tile-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tile-value{font-family:var(--serif);font-size:31px;font-weight:600;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
  .tile-meta{font-size:12px;color:var(--ink-2);margin-top:6px}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.005em}
  .section-note{font-size:12px;color:var(--ink-3)}

  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .t-wrap{overflow-x:auto}
  .clickable{cursor:pointer}
  .mono{font-variant-numeric:tabular-nums}
  .dim{color:var(--ink-3)}
  .nowrap{white-space:nowrap}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
  /* The three product lines read at a glance rather than as three near-identical
     outlines: paid is filled gold, free is a blue outline, a consultation is a
     filled ink chip. Shape and weight differ too, so they are still tellable
     apart in greyscale or by anyone who does not separate these hues. */
  .pill.paid{color:#3d2c07;background:var(--gold-l);border-color:var(--gold);font-weight:600}
  .pill.free{color:var(--free);border-color:var(--free);background:transparent}
  .pill.consultation{color:var(--surface);background:var(--ink);border-color:var(--ink);font-weight:600}
  :root[data-theme="dark"] .pill.paid{color:#1a1206}
  :root[data-theme="dark"] .pill.consultation{color:var(--bg);background:var(--ink);border-color:var(--ink)}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap}
  /* Success is the overwhelming majority of rows, so it is deliberately quiet:
     a green ring on 29 of 30 rows carries no information and fights the cream
     and gold. Only failures are allowed to be loud. */
  .pill.ok{color:var(--ink-2);border-color:var(--line)}
  .pill.bad{color:var(--danger);border-color:var(--danger)}
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ---- schedule manager ---- */
  .sched-scope{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;
               padding:9px 13px;margin-bottom:12px}
  .sched-scope b{color:var(--gold-d)}
  .sched-presets{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;
                 color:var(--ink-3);margin-bottom:6px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;
        color:var(--ink-2);background:var(--surface);transition:border-color .13s,color .13s}
  .chip:hover{border-color:var(--gold-l);color:var(--gold-d)}

  .sched-day{padding:13px 0;border-bottom:1px solid var(--line-soft)}
  .sched-day:last-of-type{border-bottom:0}
  .sched-day.off .sched-body{opacity:.32;pointer-events:none}
  .sched-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .sched-toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
  .sched-toggle input{width:36px;height:20px;appearance:none;background:var(--surface-2);border:1px solid var(--line);
    border-radius:20px;position:relative;cursor:pointer;flex:none;transition:background .16s,border-color .16s}
  .sched-toggle input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:var(--ink-3);transition:transform .16s,background .16s}
  .sched-toggle input:checked{background:var(--gold-l);border-color:var(--gold)}
  .sched-toggle input:checked::after{transform:translateX(16px);background:#fff}
  .sched-copy{font-size:11.5px;color:var(--ink-3);border:1px solid transparent;border-radius:6px;padding:4px 9px}
  .sched-copy:hover{color:var(--gold-d);border-color:var(--line)}
  .sched-day.off .sched-copy{visibility:hidden}

  .sched-fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .sf{display:flex;flex-direction:column;gap:4px;min-width:0}
  .sf span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .sf input,.sf select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font:inherit;font-size:13px;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
  .sf input:focus,.sf select:focus{outline:2px solid var(--gold-l);outline-offset:1px;border-color:var(--gold-l)}
  /* The result of the four fields above, spelled out. Divya should never have
     to imagine what her settings produce. */
  .sched-preview{font-size:12.5px;color:var(--gold-d);margin-top:9px;font-variant-numeric:tabular-nums}
  .sched-preview.bad{color:var(--danger)}
  @media (max-width:820px){
    .sched-fields{grid-template-columns:1fr 1fr}
    .sf:last-child{grid-column:1/-1}
  }

  /* ---- paid reports ---- */
  .pr-warn{font-size:12.5px;border-radius:8px;padding:10px 13px;margin-bottom:12px;
           background:rgba(214,138,58,.09);border:1px solid rgba(214,138,58,.3);color:var(--ink)}
  .pr-warn b{color:var(--gold-d)}
  .attn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--failed);margin-right:7px;vertical-align:middle}
  .state{font-size:11.5px;white-space:nowrap}
  .state.ready{color:var(--gold-d)}
  .state.waiting{color:var(--ink-3)}
  .state.bad{color:var(--danger)}

  /* ---- pricing ---- */
  .price-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);
             gap:12px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .price-row:last-of-type{border-bottom:0}
  .price-name{font-size:14px;font-weight:600;min-width:0}
  .price-name small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .price-in{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
            border-radius:8px;padding:8px 10px}
  .price-in span{color:var(--ink-3);font-size:13px}
  .price-in input{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);
                  width:100%;min-width:0;font-variant-numeric:tabular-nums}
  .price-in input:focus{outline:none}
  .price-in:focus-within{outline:2px solid var(--gold-l);outline-offset:1px;border-color:var(--gold-l)}
  /* What the customer will actually see, spelled out - same idea as the slot
     preview, so a price is never saved on trust. */
  .price-preview{font-size:12.5px;color:var(--gold-d);font-variant-numeric:tabular-nums;padding-bottom:9px}
  .price-preview s{color:var(--ink-3);margin-left:5px}
  .price-preview b{color:var(--gold-d);margin-left:5px;font-weight:600}
  .price-preview.bad{color:var(--danger)}
  @media (max-width:820px){
    .price-row{grid-template-columns:1fr 1fr}
    .price-name,.price-preview{grid-column:1/-1}
  }

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;
       font-size:13px;color:var(--ink);transition:border-color .13s,background .13s}
  .btn:hover{border-color:var(--gold-l)}
  .btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
  .btn.primary:hover{opacity:.88}
  .btn.quiet{color:var(--ink-3);border-color:transparent}
  .btn.quiet:hover{color:var(--danger);border-color:var(--danger)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .dl{font-size:12px;color:var(--gold-d);border:1px solid var(--line);border-radius:7px;
      padding:5px 11px;white-space:nowrap;transition:border-color .13s,background .13s}
  .dl:hover{border-color:var(--gold);background:var(--surface-2)}
  .dl:disabled{opacity:.45;cursor:not-allowed}
  .save-note{font-size:12.5px;color:var(--ink-3)}
  .save-note.ok{color:var(--gold-d)}
  .save-note.bad{color:var(--danger)}
  .block-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .block-row:last-child{border-bottom:0}
  .block-add{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
  .block-add .f{display:flex;flex-direction:column;gap:4px}
  .block-add label{font-size:11.5px;color:var(--ink-3)}
  .block-add input{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink)}
  .empty{text-align:center;padding:42px 20px;color:var(--ink-3);font-size:13px}
  .empty strong{display:block;font-family:var(--serif);color:var(--ink-2);font-size:16px;margin-bottom:6px;font-weight:600}
  .err{background:var(--surface);border:1px solid var(--danger);color:var(--danger);padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:14px}
  .skeleton{height:78px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

  .search{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;min-width:230px;font-family:var(--sans)}
  .search:focus{outline:none;border-color:var(--gold)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
  .pager button{border:1px solid var(--line);border-radius:7px;padding:5px 12px;color:var(--ink-2)}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager button:not(:disabled):hover{color:var(--ink);border-color:var(--gold)}

  .bars{display:flex;align-items:flex-end;justify-content:space-between;gap:3px;height:152px;padding-top:6px}
  .bar-col{flex:1;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0;position:relative;height:100%}
  .bar-col:hover .bar-seg{filter:brightness(1.15)}
  .bar-seg{border-radius:3px;min-height:2px}
  .bar-seg.top{border-radius:4px 4px 3px 3px}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:9px;border-top:1px solid var(--line-soft);padding-top:7px}
  .tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;z-index:60;opacity:0;transition:opacity .1s;box-shadow:var(--shadow);color:var(--ink)}
  .tip.on{opacity:1}
  .tip b{display:block;margin-bottom:5px;color:var(--gold-d);font-size:11.5px;font-family:var(--serif)}
  .tip i{font-style:normal;display:flex;justify-content:space-between;gap:16px}

  .drawer{position:fixed;inset:0;background:rgba(10,8,6,.55);display:none;z-index:70}
  .drawer.on{display:block}
  /* surface, not bg - in the dark theme a panel painted the same colour as the
     page behind it reads as a hole rather than a sheet slid over the top. */
  .drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-18px 0 44px rgba(0,0,0,.22);overflow-y:auto;padding:26px 28px}
  .drawer-close{position:absolute;right:20px;top:18px;font-size:24px;color:var(--ink-3);line-height:1}
  .drawer-close:hover{color:var(--ink)}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 16px;font-size:13px;margin-top:14px}
  .kv dt{color:var(--ink-3)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .statrow{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .statrow>div{flex:1;padding:13px 15px;border-right:1px solid var(--line);min-width:0}
  .statrow>div:last-child{border-right:0}
  .statrow .tile-value{font-size:22px;margin-top:5px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <img src="/admin/divya-bajaj-monogram.svg" alt="">
      <div>
        <div class="brand-name">Divya Bajaj</div>
        <div class="brand-sub">Admin</div>
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button class="theme-btn" id="themeBtn" type="button"></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">Overview</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="controls">
        <div class="seg" id="envSeg" role="group" aria-label="Environment"></div>
        <div class="seg" id="daySeg" role="group" aria-label="Time range"></div>
      </div>
    </div>
    <div id="envNote" class="env-note" style="margin:8px 0 0"></div>
    <div class="rule"></div>
    <div id="view"></div>
  </main>
</div>

<div class="tip" id="tip"></div>
<div class="drawer" id="drawer"><div class="drawer-panel"><button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button><div id="drawerBody"></div></div></div>

<script>
(function () {
  'use strict';

  var SECTIONS = [
    { id: 'overview',      label: 'Overview',      sub: 'How the business is doing' },
    { id: 'reports',       label: 'Reports',       sub: 'Every report generated, free and paid' },
    { id: 'customers',     label: 'Customers',     sub: 'Everyone who has come through' },
    { id: 'consultations', label: 'Consultations', sub: 'Bookings and appointments' },
    { id: 'health',        label: 'Health',        sub: 'Failures, slow generations and stuck work' }
  ];

  var state = {
    section: 'overview',
    environment: 'production',
    days: 30,
    reportPage: 1, reportCategory: 'all', reportStatus: 'all',
    customerPage: 1, customerSearch: '',
    failedCount: 0
  };

  var $ = function (id) { return document.getElementById(id); };
  var view = $('view');

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function num(value) {
    return value === null || value === undefined ? '—' : Number(value).toLocaleString('en-IN');
  }

  // Durations read as minutes once they pass a minute, because a paid report
  // takes two to three of them and "148s" makes nobody picture that.
  function duration(seconds) {
    if (seconds === null || seconds === undefined || !isFinite(seconds)) return '—';
    var s = Number(seconds);
    if (s < 1) return '<1s';
    if (s < 60) return Math.round(s) + 's';
    var m = Math.floor(s / 60);
    var rest = Math.round(s % 60);
    return m + 'm' + (rest ? ' ' + rest + 's' : '');
  }

  function when(iso) {
    if (!iso) return '—';
    var then = new Date(iso).getTime();
    if (!isFinite(then)) return '—';
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.floor(mins / 60) + 'h ago';
    var days = Math.floor(mins / 1440);
    if (days < 30) return days + 'd ago';
    return new Date(iso).toLocaleDateString('en-IN', { timeZone: IST, day: 'numeric', month: 'short', year: 'numeric' });
  }

  // Divya works in IST and every customer confirmation quotes IST, so the panel
  // must too. Without this the browser's own timezone decides: on a laptop set
  // to UTC an 11:30 am IST call renders as 06:00 am, which is exactly how
  // someone misses their own appointment. Pinning it also means the panel reads
  // the same from anywhere she happens to be.
  var IST = 'Asia/Kolkata';

  function exactWhen(iso, withZone) {
    if (!iso) return '';
    var d = new Date(iso);
    if (!isFinite(d.getTime())) return '';
    var text = d.toLocaleString('en-IN', {
      timeZone: IST, day: 'numeric', month: 'short', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    });
    return withZone ? text + ' IST' : text;
  }

  /**
   * Writes to /api/admin/schedule. Kept separate from api() so it is obvious at
   * every call site which requests can change something.
   */
  function apiWrite(path, method, body) {
    return fetch('/api/admin/schedule' + path + '?environment=' + encodeURIComponent(state.environment), {
      method: method,
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (response) {
      return response.text().then(function (raw) {
        var parsed;
        try { parsed = raw ? JSON.parse(raw) : {}; } catch (e) { parsed = { error: raw }; }
        if (!response.ok) throw new Error(parsed.error || ('Request failed (' + response.status + ')'));
        return parsed;
      });
    });
  }

  /**
   * Prices. No environment parameter: like the hours, a price belongs to the
   * site you are looking at, not to the Live/Test analytics filter, so changing
   * one on a preview can never alter what the live site charges.
   */
  function apiPricing(method, body) {
    return fetch('/api/admin/pricing', {
      method: method || 'GET',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      cache: 'no-store',
      body: body ? JSON.stringify(body) : undefined
    }).then(function (response) {
      return response.text().then(function (raw) {
        var parsed;
        try { parsed = raw ? JSON.parse(raw) : {}; } catch (e) { parsed = { error: raw }; }
        if (!response.ok) throw new Error(parsed.error || ('Request failed (' + response.status + ')'));
        return parsed;
      });
    });
  }

  function apiSchedule() {
    return fetch('/api/admin/schedule?environment=' + encodeURIComponent(state.environment),
      { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); });
  }

  function api(path, params) {
    var query = Object.assign({ environment: state.environment }, params || {});
    var qs = Object.keys(query)
      .filter(function (k) { return query[k] !== '' && query[k] !== undefined && query[k] !== null; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(query[k]); })
      .join('&');
    return fetch('/api/admin/' + path + (qs ? '?' + qs : ''), { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (response) {
        return response.text().then(function (raw) {
          var body;
          try { body = raw ? JSON.parse(raw) : {}; } catch (e) { body = { error: raw }; }
          if (!response.ok) throw new Error(body.error || ('Request failed (' + response.status + ')'));
          return body;
        });
      });
  }

  function loading(count) {
    var out = '<div class="grid tiles">';
    for (var i = 0; i < (count || 4); i += 1) out += '<div class="skeleton"></div>';
    return out + '</div>';
  }

  function fail(message) {
    return '<div class="err"><strong>Could not load this.</strong> ' + esc(message) + '</div>';
  }

  function empty(title, note) {
    return '<div class="card"><div class="empty"><strong>' + esc(title) + '</strong>' + esc(note || '') + '</div></div>';
  }

  function tile(label, value, meta, small) {
    return '<div class="card"><div class="tile-label">' + esc(label) + '</div>' +
      '<div class="tile-value' + (small ? ' sm' : '') + '">' + value + '</div>' +
      (meta ? '<div class="tile-meta">' + meta + '</div>' : '') + '</div>';
  }

  /* ---------------- chart ----------------
     Stacked bars, one column per day: paid and free stack as the work done,
     failures sit on top in the reserved status red. Identity is carried by a
     legend and by the tooltip, never by colour alone. */
  function barChart(series) {
    var max = series.reduce(function (m, d) { return Math.max(m, d.paid + d.free + d.failed); }, 0);
    if (!max) {
      return '<div class="empty"><strong>Nothing in this window</strong>No reports were generated in the last ' + state.days + ' days.</div>';
    }
    var cols = series.map(function (d, i) {
      var total = d.paid + d.free + d.failed;
      var seg = function (value, varName, isTop) {
        if (!value) return '';
        return '<div class="bar-seg' + (isTop ? ' top' : '') + '" style="height:' + (value / max * 100) + '%;background:var(' + varName + ')"></div>';
      };
      // stacking order top-down: failed, free, paid
      return '<div class="bar-col" data-i="' + i + '" tabindex="0" role="img" aria-label="' +
        esc(d.date + ': ' + d.paid + ' paid, ' + d.free + ' free, ' + d.failed + ' failed') + '">' +
        seg(d.failed, '--failed', true) +
        seg(d.free, '--free', !d.failed) +
        seg(d.paid, '--paid', !d.failed && !d.free) +
        (total ? '' : '') + '</div>';
    }).join('');

    var first = series[0] ? series[0].date : '';
    var mid = series[Math.floor(series.length / 2)] ? series[Math.floor(series.length / 2)].date : '';
    var last = series[series.length - 1] ? series[series.length - 1].date : '';
    var label = function (d) { return d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : ''; };

    return '<div class="bars" id="bars">' + cols + '</div>' +
      '<div class="axis"><span>' + esc(label(first)) + '</span><span>' + esc(label(mid)) + '</span><span>' + esc(label(last)) + '</span></div>';
  }

  function wireChart(series) {
    var host = $('bars');
    if (!host) return;
    var tip = $('tip');
    function show(event, index) {
      var d = series[index];
      if (!d) return;
      tip.innerHTML = '<b>' + esc(new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })) + '</b>' +
        '<i><span>Paid</span><span class="mono">' + d.paid + '</span></i>' +
        '<i><span>Free</span><span class="mono">' + d.free + '</span></i>' +
        (d.failed ? '<i><span style="color:var(--danger)">Failed</span><span class="mono">' + d.failed + '</span></i>' : '') +
        '<i class="dim"><span>New leads</span><span class="mono">' + d.leads + '</span></i>';
      tip.classList.add('on');
      var rect = tip.getBoundingClientRect();
      var x = (event.clientX || 0) + 14;
      tip.style.left = Math.min(x, window.innerWidth - rect.width - 12) + 'px';
      tip.style.top = Math.max(8, (event.clientY || 0) - rect.height - 12) + 'px';
    }
    host.addEventListener('mousemove', function (event) {
      var col = event.target.closest ? event.target.closest('.bar-col') : null;
      if (col) show(event, Number(col.getAttribute('data-i')));
      else tip.classList.remove('on');
    });
    host.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
    host.addEventListener('focusin', function (event) {
      var col = event.target.closest ? event.target.closest('.bar-col') : null;
      if (!col) return;
      var box = col.getBoundingClientRect();
      show({ clientX: box.left, clientY: box.top }, Number(col.getAttribute('data-i')));
    });
    host.addEventListener('focusout', function () { tip.classList.remove('on'); });
  }

  /* ---------------- sections ---------------- */

  function renderOverview() {
    view.innerHTML = loading(4);
    api('overview', { days: state.days }).then(function (d) {
      state.failedCount = d.reports.failed;
      renderNav();

      var gen = d.generation_time_seconds.all;
      var paidGen = d.generation_time_seconds.paid;
      var successMeta = d.reports.failed
        ? '<span style="color:var(--danger)">' + d.reports.failed + ' failed</span>'
        : 'no failures';

      var html = '<div class="grid tiles">' +
        tile('Reports', num(d.reports.total),
          d.reports.paid + ' paid &middot; ' + d.reports.free + ' free') +
        tile('Success rate', (d.reports.success_rate === null ? '—' : d.reports.success_rate + '%'), successMeta) +
        tile('Typical generation', duration(paidGen.median !== null ? paidGen.median : gen.median),
          'a paid report, median of ' + (paidGen.measured || 0)) +
        tile('New leads', num(d.leads.total), d.leads.today + ' today') +
        '</div>';

      html += '<div class="card" style="margin-top:14px">' +
        '<div class="section-head"><div><div class="section-title">Reports per day</div>' +
        '<div class="section-note">Last ' + d.window_days + ' days</div></div>' +
        '<div class="legend">' +
          '<span><i class="swatch" style="background:var(--paid)"></i>Paid</span>' +
          '<span><i class="swatch" style="background:var(--free)"></i>Free</span>' +
          '<span><i class="swatch" style="background:var(--failed)"></i>Failed</span>' +
        '</div></div>' + barChart(d.series) + '</div>';

      html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px">';

      html += '<div class="card"><div class="section-head"><div class="section-title">Generation time</div>' +
        '<div class="section-note">completed reports</div></div>' +
        (gen.measured
          ? '<div class="statrow">' +
              '<div><div class="tile-label">Median</div><div class="tile-value">' + duration(gen.median) + '</div></div>' +
              '<div><div class="tile-label">90th pct</div><div class="tile-value">' + duration(gen.p90) + '</div></div>' +
              '<div><div class="tile-label">Slowest</div><div class="tile-value">' + duration(gen.slowest) + '</div></div>' +
            '</div>' +
            '<div class="tile-meta" style="margin-top:10px">Measured on ' + gen.measured + ' report' + (gen.measured === 1 ? '' : 's') +
            (d.generation_time_seconds.free.measured ? '' : '. Free reports finish instantly and are not timed.') + '</div>'
          : '<div class="empty">No timed reports in this window.</div>') +
        '</div>';

      var sources = Object.keys(d.leads.by_source).sort(function (a, b) { return d.leads.by_source[b] - d.leads.by_source[a]; });
      html += '<div class="card"><div class="section-head"><div class="section-title">Where leads came from</div></div>' +
        (sources.length
          ? '<div class="t-wrap"><table><tbody>' + sources.map(function (key) {
              return '<tr><td>' + esc(key) + '</td><td class="mono" style="text-align:right;width:60px">' + d.leads.by_source[key] + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<div class="empty">No leads in this window.</div>') +
        '</div>';

      html += '<div class="card"><div class="section-head"><div class="section-title">Revenue</div></div>' +
        '<div class="tile-value">₹' + num(d.revenue.captured) + '</div>' +
        '<div class="tile-meta">' + (d.revenue.transactions
          ? d.revenue.transactions + ' captured payment' + (d.revenue.transactions === 1 ? '' : 's')
          : 'No payment gateway is live yet, so this stays at zero until one is connected.') + '</div>' +
        '<div class="tile-meta" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
        'Consultations booked: <span class="mono">' + (d.consultations.bookings + d.consultations.appointments) + '</span></div>' +
        '</div>';

      html += '</div>';
      view.innerHTML = html;
      wireChart(d.series);
    }).catch(function (error) { view.innerHTML = fail(error.message); });
  }

  /* ---------------- paid blueprints (money already taken) ---------------- */

  function apiPaidReports(path, method) {
    return fetch('/api/admin/paid-reports' + (path || ''), {
      method: method || 'GET',
      headers: { Accept: 'application/json' },
      cache: 'no-store'
    }).then(function (response) {
      return response.text().then(function (raw) {
        var parsed;
        try { parsed = raw ? JSON.parse(raw) : {}; } catch (e) { parsed = { error: raw }; }
        if (!response.ok) throw new Error(parsed.error || ('Request failed (' + response.status + ')'));
        return parsed;
      });
    });
  }

  function stateClass(item) {
    if (item.status === 'generated') return 'ready';
    if (item.status === 'failed' || item.status === 'refunded') return 'bad';
    return 'waiting';
  }

  /**
   * Everyone who has paid, and what they actually got.
   *
   * This is the card that makes "took the money, delivered nothing" visible
   * instead of silent.
   */
  function paidReportsCard(d) {
    if (!d) return '';

    var warn = '';
    if (!d.can_deliver) {
      warn = '<div class="pr-warn">No WhatsApp or email provider is connected yet, so finished reports are <b>not being sent</b>. ' +
        'Customers see their report on screen and can download it. ' +
        (d.counts.undelivered ? '<b>' + d.counts.undelivered + '</b> finished report' + (d.counts.undelivered > 1 ? 's have' : ' has') + ' never been sent to anyone.' : '') +
        '</div>';
    }

    if (!d.items.length) {
      return '<div class="card" style="margin-bottom:14px">' +
        '<div class="section-head"><div class="section-title">Paid blueprints</div>' +
        '<div class="section-note">' + esc(d.price_formatted) + ' each &middot; ' + esc(d.environment_label) + '</div></div>' +
        warn + '<div class="dim" style="font-size:13px">Nobody has paid for a blueprint yet.</div></div>';
    }

    var rows = d.items.map(function (i) {
      var actions = '';
      if (i.status === 'failed' || i.status === 'queued') actions += '<button class="dl" data-retry="' + esc(i.id) + '">Retry</button> ';
      if (i.status === 'generated' && d.can_deliver) actions += '<button class="dl" data-resend="' + esc(i.id) + '">Resend</button> ';
      if (i.status === 'failed') actions += '<button class="btn quiet" data-refund="' + esc(i.id) + '">Refund</button>';

      return '<tr>' +
        '<td>' + (i.needs_attention ? '<span class="attn" title="Needs your attention"></span>' : '') + esc(i.name || '—') +
          (i.phone ? '<div class="dim" style="font-size:11.5px">' + esc(i.phone) + '</div>' : '') +
          (i.email ? '<div class="dim" style="font-size:11.5px">' + esc(i.email) + '</div>' : '') + '</td>' +
        '<td class="nowrap" title="' + esc(exactWhen(i.paid_at)) + '">' + esc(when(i.paid_at)) + '</td>' +
        '<td><span class="state ' + stateClass(i) + '">' + esc(i.state_label) + '</span>' +
          (i.attempts > 1 && i.status !== 'generated' ? '<div class="dim" style="font-size:11px">attempt ' + i.attempts + ' of ' + i.max_attempts + '</div>' : '') +
          (i.last_error ? '<div class="dim" style="font-size:11px">' + esc(i.last_error.slice(0, 60)) + '</div>' : '') + '</td>' +
        '<td class="nowrap"><span class="state ' + (i.delivered ? 'ready' : 'waiting') + '">' +
          (i.status !== 'generated' ? '—' : i.delivered ? 'Sent' : 'Not sent') + '</span></td>' +
        '<td style="font-size:12px">' + esc(i.question) + '</td>' +
        '<td class="nowrap" style="text-align:right">' + actions + '</td>' +
        '</tr>';
    }).join('');

    return '<div class="card" style="padding:0;margin-bottom:14px">' +
      '<div class="section-head" style="padding:17px 19px 0;margin-bottom:8px">' +
      '<div class="section-title">Paid blueprints</div>' +
      '<div class="section-note">' + d.counts.ready + ' ready &middot; ' + d.counts.waiting + ' waiting &middot; ' +
        d.counts.failed + ' failed &middot; ' + d.counts.refunded + ' refunded</div></div>' +
      (warn ? '<div style="padding:0 19px">' + warn + '</div>' : '') +
      '<div class="t-wrap"><table>' +
      '<thead><tr><th>Customer</th><th>Paid</th><th>Report</th><th>Sent</th><th>Question</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }

  function wirePaidReports() {
    var run = function (button, path, working) {
      var original = button.textContent;
      button.disabled = true;
      button.textContent = working;
      apiPaidReports(path, 'POST')
        .then(function () { renderReports(); })
        .catch(function (error) {
          button.textContent = 'Failed';
          button.title = error.message;
          setTimeout(function () { button.textContent = original; button.disabled = false; }, 3000);
        });
    };

    document.querySelectorAll('[data-retry]').forEach(function (b) {
      b.addEventListener('click', function () { run(b, '/' + b.getAttribute('data-retry') + '/retry', 'Writing...'); });
    });
    document.querySelectorAll('[data-resend]').forEach(function (b) {
      b.addEventListener('click', function () { run(b, '/' + b.getAttribute('data-resend') + '/resend', 'Sending...'); });
    });
    document.querySelectorAll('[data-refund]').forEach(function (b) {
      b.addEventListener('click', function () {
        // Money leaving is the one action in this panel that cannot be undone.
        if (!window.confirm('Refund this payment in full? This cannot be undone.')) return;
        run(b, '/' + b.getAttribute('data-refund') + '/refund', 'Refunding...');
      });
    });
  }

  function renderReports() {
    var head =
      '<div class="controls" style="margin-bottom:14px">' +
        '<div class="seg" id="catSeg">' +
          ['all', 'paid', 'free'].map(function (c) {
            return '<button data-cat="' + c + '" aria-pressed="' + (state.reportCategory === c) + '">' +
              (c === 'all' ? 'All' : c === 'paid' ? 'Paid' : 'Free') + '</button>';
          }).join('') +
        '</div>' +
        '<div class="seg" id="statSeg">' +
          ['all', 'completed', 'failed'].map(function (s) {
            return '<button data-stat="' + s + '" aria-pressed="' + (state.reportStatus === s) + '">' +
              (s === 'all' ? 'Any status' : s === 'completed' ? 'Completed' : 'Failed') + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    view.innerHTML = head + loading(1);

    Promise.all([
      api('reports', { days: state.days, category: state.reportCategory, status: state.reportStatus, page: state.reportPage }),
      // Must never take the tab down: on a deployment without Supabase this
      // answers 503, and the report list still needs to show.
      apiPaidReports().catch(function (error) { console.error('[paid-reports]', error.message); return null; })
    ])
      .then(function (both) {
        var d = both[0], paid = both[1];
        var body = !d.rows.length
          ? empty('No reports here', 'Nothing matches these filters in this environment.')
          : '<div class="card" style="padding:0"><div class="t-wrap"><table>' +
            '<thead><tr><th>Customer</th><th>Type</th><th>Status</th><th>Took</th><th>Generated</th><th>Report</th></tr></thead><tbody>' +
            d.rows.map(function (r) {
              return '<tr class="clickable" data-lead="' + esc(r.lead_id) + '">' +
                '<td>' + esc(r.lead_name || '—') + '<div class="dim" style="font-size:11.5px">' + esc(r.lead_email || '') + '</div></td>' +
                '<td>' + productTag(r.category) +
                  '<div class="dim nowrap" style="font-size:11px;margin-top:3px">' + esc(r.type) + '</div></td>' +
                '<td><span class="pill ' + (r.status === 'failed' ? 'bad' : 'ok') + '">' + esc(r.status) + '</span>' +
                  (r.failure_code ? '<div class="dim" style="font-size:11px;margin-top:3px">' + esc(r.failure_code) + '</div>' : '') + '</td>' +
                '<td class="mono nowrap">' + duration(r.generation_seconds) + '</td>' +
                '<td class="nowrap" title="' + esc(exactWhen(r.created_at)) + '">' + esc(when(r.created_at)) + '</td>' +
                // Stop the row-click drawer firing when the button is pressed.
                '<td onclick="event.stopPropagation()">' + downloadButton(r) + '</td>' +
                '</tr>';
            }).join('') +
            '</tbody></table></div></div>' + pager(d, 'reportPage');

        view.innerHTML = head + paidReportsCard(paid) + body;
        wireSegs();
        wirePaidReports();
        wirePager('reportPage', renderReports);
        wireRowDrawer();
        wireDownloads();
      })
      .catch(function (error) { view.innerHTML = head + fail(error.message); });
  }

  function renderCustomers() {
    var head = '<div class="controls" style="margin-bottom:14px">' +
      '<input class="search" id="custSearch" placeholder="Search name, email or phone" value="' + esc(state.customerSearch) + '">' +
      '</div>';
    view.innerHTML = head + loading(1);

    api('customers', { search: state.customerSearch, page: state.customerPage }).then(function (d) {
      var body = !d.rows.length
        ? empty('No customers found', state.customerSearch ? 'Nothing matches that search.' : 'No one in this environment yet.')
        : '<div class="card" style="padding:0"><div class="t-wrap"><table>' +
          '<thead><tr><th>Name</th><th>Contact</th><th>Has bought</th><th>Status</th><th>Joined</th></tr></thead><tbody>' +
          d.rows.map(function (l) {
            return '<tr class="clickable" data-lead="' + esc(l.id) + '">' +
              '<td>' + esc(l.name || '—') + '<div class="dim" style="font-size:11.5px">' + esc(l.pob || '') + '</div></td>' +
              '<td style="font-size:12px">' + esc(l.email || '') + '<div class="dim">' + esc(l.phone || '') + '</div></td>' +
              // What they have actually bought, as tags rather than a number nobody
              // can decode. A repeat paid customer reads differently at a glance
              // from someone who only ever pulled the free report.
              '<td><div class="tag-row">' +
                (l.reports.paid ? '<span class="pill paid">' + (l.reports.paid > 1 ? l.reports.paid + '&times; ' : '') + 'Paid report</span>' : '') +
                (l.reports.consultations ? '<span class="pill consultation">' + (l.reports.consultations > 1 ? l.reports.consultations + '&times; ' : '') + 'Consultation</span>' : '') +
                (l.reports.free ? '<span class="pill free">' + (l.reports.free > 1 ? l.reports.free + '&times; ' : '') + 'Free report</span>' : '') +
                (l.reports.failed ? '<span class="pill bad">' + l.reports.failed + ' failed</span>' : '') +
                (!l.reports.total && !l.reports.consultations ? '<span class="dim" style="font-size:12px">nothing yet</span>' : '') +
              '</div></td>' +

          }).join('') + '</tbody></table></div></div>' + pager(d, 'customerPage');

      view.innerHTML = head + body;
      var box = $('custSearch');
      var timer;
      box.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          state.customerSearch = box.value;
          state.customerPage = 1;
          renderCustomers();
          var again = $('custSearch');
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        }, 300);

      wireRowDrawer();
    }).catch(function (error) { view.innerHTML = head + fail(error.message); });
  }

  /* ---------------- schedule manager ---------------- */

  var DAY_LABELS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  /**
   * Live preview of what one row actually produces. Divya was being asked to
   * imagine the result of four fields; now she just reads it.
   */
  function previewTimes(from, to, length, cap) {
    var parse = function (v) { var m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null; };
    var open = parse(from), close = parse(to), n = Number(length) || 60;
    if (open == null || close == null || close <= open || n <= 0) return { text: 'set a valid start and end', bad: true };
    var times = [];
    for (var t = open; t + n <= close; t += n) {
      if (cap && times.length >= cap) break;
      var h = Math.floor(t / 60), m = t % 60;
      var ampm = h >= 12 ? 'pm' : 'am', h12 = h % 12 === 0 ? 12 : h % 12;
      times.push(h12 + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ampm);
    }
    if (!times.length) return { text: 'too short for one ' + n + ' minute call', bad: true };
    return { text: times.join(', ') + '  ·  ' + times.length + ' slot' + (times.length > 1 ? 's' : ''), bad: false };
  }

  /* ---------------- pricing ---------------- */

  // Cards on the landing page read left to right in this order; the panel
  // matches so the two are read the same way.
  var PRICE_ORDER = ['paid_blueprint', 'consultation'];
  var PRICE_WHERE = {
    paid_blueprint: 'Landing page card, and the report window',
    consultation: 'Landing page card, the booking form, and what Razorpay charges'
  };

  function rupees(n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }

  /**
   * Exactly what a customer will see, and the same rules the server enforces,
   * so a price is never rejected after the fact.
   */
  function pricePreview(amount, compareAt) {
    var price = Number(amount);
    if (!isFinite(price) || price < 1) return { html: 'enter a price of at least ₹1', bad: true };
    if (Math.round(price) !== price) return { html: 'whole rupees only, no paise', bad: true };
    if (price > 500000) return { html: 'that looks like a slip — the most allowed is ₹5,00,000', bad: true };

    var raw = String(compareAt == null ? '' : compareAt).trim();
    if (raw === '') return { html: esc(rupees(price)), bad: false };

    var was = Number(raw);
    if (!isFinite(was)) return { html: 'the "was" price is not a number', bad: true };
    if (was <= price) return { html: 'the "was" price has to be higher than the price, or left empty', bad: true };

    var percent = Math.round(((was - price) / was) * 100);
    return { html: esc(rupees(price)) + '<s>' + esc(rupees(was)) + '</s><b>Save ' + percent + '%</b>', bad: false };
  }

  function pricingCard(pr) {
    var products = PRICE_ORDER
      .map(function (code) {
        return pr.products.filter(function (p) { return p.product_code === code; })[0];
      })
      .filter(Boolean);

    var rows = products.map(function (p) {
      var compare = p.compare_at_inr == null ? '' : p.compare_at_inr;
      var preview = pricePreview(p.amount_inr, compare);
      return '<div class="price-row" data-price="' + esc(p.product_code) + '">' +
        '<div class="price-name">' + esc(p.label) +
          '<small>' + esc(PRICE_WHERE[p.product_code] || '') + '</small></div>' +
        '<label class="sf"><span>Price</span>' +
          '<div class="price-in"><span>₹</span>' +
          '<input type="number" class="p-amount" min="1" step="1" value="' + esc(p.amount_inr) + '"></div></label>' +
        '<label class="sf"><span>Was (optional)</span>' +
          '<div class="price-in"><span>₹</span>' +
          '<input type="number" class="p-compare" min="0" step="1" placeholder="none" value="' + esc(compare) + '"></div></label>' +
        '<div class="price-preview' + (preview.bad ? ' bad' : '') + '">' + preview.html + '</div>' +
      '</div>';
    }).join('');

    return '<div class="card" style="margin-top:14px">' +
      '<div class="section-head"><div class="section-title">What each package costs</div>' +
      '<div class="section-note">shown on the site and charged at checkout</div></div>' +
      '<div class="sched-scope">These prices control <b>' + esc(pr.environment_label) + '</b>.</div>' +
      rows +
      '<div class="btn-row"><button class="btn primary" id="savePrices">Save prices</button>' +
      '<span class="save-note" id="priceNote">The "was" price is the struck-through one. Leave it empty to show no discount.' +
      '</span></div></div>';
  }

  function paintPricePreview(row) {
    var out = row.querySelector('.price-preview');
    var p = pricePreview(row.querySelector('.p-amount').value, row.querySelector('.p-compare').value);
    out.innerHTML = p.html;
    out.classList.toggle('bad', p.bad);
  }

  function wirePricing() {
    var rows = Array.prototype.slice.call(document.querySelectorAll('.price-row'));
    if (!rows.length) return;

    rows.forEach(function (row) {
      row.addEventListener('input', function () { paintPricePreview(row); });
    });

    var button = $('savePrices');
    var note = $('priceNote');
    if (!button) return;

    button.addEventListener('click', function () {
      var bad = rows.filter(function (row) {
        return pricePreview(row.querySelector('.p-amount').value, row.querySelector('.p-compare').value).bad;
      });
      if (bad.length) {
        note.textContent = 'Fix the highlighted price first.';
        note.className = 'save-note bad';
        bad[0].querySelector('.p-amount').focus();
        return;
      }

      var products = rows.map(function (row) {
        var compare = String(row.querySelector('.p-compare').value).trim();
        return {
          product_code: row.getAttribute('data-price'),
          amount_inr: Number(row.querySelector('.p-amount').value),
          compare_at_inr: compare === '' ? null : Number(compare)
        };
      });

      button.disabled = true;
      note.textContent = 'Saving…';
      note.className = 'save-note';

      apiPricing('PUT', { products: products })
        .then(function () {
          note.textContent = 'Saved. The site and checkout are using these prices now.';
          note.className = 'save-note ok';
        })
        .catch(function (error) {
          note.textContent = error.message;
          note.className = 'save-note bad';
        })
        .then(function () { button.disabled = false; });
    });
  }

    }).join('');

    return '<div class="card">' +
      '<div class="section-head"><div class="section-title">When Divya takes calls</div>' +
      '<div class="section-note">India Standard Time</div></div>' +
      '<div class="sched-scope">These hours control <b>' + esc(sched.environment_label) + '</b>.</div>' +
      '<div class="sched-presets">Quick start:' +
        '<button class="chip" data-preset="weekday-eve">Weekday evenings</button>' +
        '<button class="chip" data-preset="weekend-morning">Weekend mornings</button>' +
        '<button class="chip" data-preset="everyday-eve">Every evening</button>' +
        '<button class="chip" data-preset="clear">Clear all</button>' +
      '</div>' +
      rows +
      '<div class="btn-row"><button class="btn primary" id="saveHours">Save hours</button>' +
      '<span class="save-note" id="hoursNote">Nobody can book less than ' +
        Math.round(sched.min_notice_minutes / 60) + 'h ahead. A slot is held ' + sched.hold_minutes +
        ' minutes while they pay.</span></div></div>';
  }

  var PRESETS = {
    'weekday-eve':     { days: [1, 2, 3, 4, 5], from: '18:00', to: '21:00' },
    'weekend-morning': { days: [0, 6],          from: '10:00', to: '13:00' },
    'everyday-eve':    { days: [0, 1, 2, 3, 4, 5, 6], from: '18:00', to: '21:00' },
    'clear':           { days: [],              from: '18:00', to: '20:00' }
  };

  function rowOf(weekday) { return document.querySelector('.sched-day[data-weekday="' + weekday + '"]'); }

  function paintPreview(row) {
    var out = row.querySelector('.sched-preview');
    var cap = row.querySelector('.s-cap').value;
    var p = previewTimes(
      row.querySelector('.s-from').value, row.querySelector('.s-to').value,
      row.querySelector('.s-len').value, cap === '' ? null : Number(cap)
    );
    out.textContent = p.text;
    out.classList.toggle('bad', p.bad);
  }

  function readWeek() {
    return Array.prototype.map.call(document.querySelectorAll('.sched-day'), function (row) {
      var pick = function (sel) { return row.querySelector(sel); };
      var cap = pick('.s-cap').value;
      return {
        weekday: Number(row.getAttribute('data-weekday')),
        is_active: pick('.s-on').checked,
        start_time: pick('.s-from').value,
        end_time: pick('.s-to').value,
        slot_duration_minutes: Number(pick('.s-len').value),
        buffer_after_minutes: Number(pick('.s-gap').value),
        buffer_before_minutes: 0,
        max_bookings: cap === '' ? null : Number(cap)
      };
    });
  }

  function blocksCard(sched) {
    var rows = sched.blocked.length
      ? sched.blocked.map(function (b) {

            (b.reason ? '<span class="dim">' + esc(b.reason) + '</span>' : '') +

        }).join('')
      : '<div class="dim" style="font-size:13px;padding:6px 0">Nothing blocked. Add a holiday or a day off below.</div>';

    return '<div class="card" style="margin-top:14px">' +
